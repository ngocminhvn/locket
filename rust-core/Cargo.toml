[package]
name = "locket-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "locket_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
