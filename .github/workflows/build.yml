name: Build Locket Android APK

on:
  # Ordinary source pushes never build. This marker is updated only on explicit request.
  push:
    branches: [main]
    paths: ['.github/manual-build-request.txt']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (R) — unchecked builds Dev'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: locket-pages-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[manual build request]'))
    name: Build signed APK
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}

    env:
      LOCKET_CHANNEL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release build]'))) && 'release' || 'dev' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Install Android API 37.1
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --channel=3 --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Test and build Rust core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cargo test --manifest-path rust-core/Cargo.toml --locked
          ./scripts/build-rust-android.sh
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "app/src/main/jniLibs/$abi/liblocket_core.so"
          done

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Restore persistent signing key
        env:
          LOCKET_DEBUG_KEYSTORE_B64: ${{ secrets.LOCKET_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$LOCKET_DEBUG_KEYSTORE_B64" ]]; then
            echo "::error::LOCKET_DEBUG_KEYSTORE_B64 is required; refusing to generate a different signing key."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/locket-signing.keystore"
          printf '%s' "$LOCKET_DEBUG_KEYSTORE_B64" | base64 --decode > "$key"
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          echo "LOCKET_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Build explicitly signed Release APK
        run: |
          gradle assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file="$LOCKET_KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify R8 mapping
        run: test -s app/build/outputs/mapping/release/mapping.txt

      - name: Verify APK certificate and continuity with published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk"
          unzip -l "$apk" | grep -F 'assets/dexopt/baseline.prof'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
          certificate() {
            "$signer" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1
          }
          actual="$(certificate "$apk")"
          expected="$(keytool -exportcert -keystore "$LOCKET_KEYSTORE" -alias androiddebugkey -storepass android | sha256sum | cut -d' ' -f1)"
          test -n "$actual"
          test -n "$expected"
          echo "APK signing certificate SHA-256: $actual"
          echo "Keystore certificate SHA-256: $expected"
          if [[ "${actual,,}" != "${expected,,}" ]]; then
            echo "::error::APK was not signed by the configured Locket keystore."
            exit 1
          fi
          # Compare against the latest existing version and the first known
          # signed update (23). Never publish a breaking signing-key migration.
          # Exception (one-time rotation approved by the owner 2026-11-27):
          # v1.0.23 and v1.0.24 were published before the persistent keystore
          # existed, so they were signed with ephemeral runner-generated
          # debug keys that are lost forever. Their certificates can never
          # match the configured keystore. From the next release on, the
          # keystore key is the single source of truth (checked above), so
          # the comparison below passes again for every newer release.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
            latest="$(printf '%s\n' "$releases" | grep -E '^v1\.0\.[0-9]+$' | sort -V | tail -n1 || true)"
            if [[ -n "$latest" && "$GITHUB_RUN_NUMBER" -lt "${latest##*.}" ]]; then
              echo "::error::Refusing to publish an older build as latest."
              exit 1
            fi
            for tag in "$latest" v1.0.23; do
              [[ -n "$tag" ]] || continue
              if ! printf '%s\n' "$releases" | grep -Fxq "$tag"; then continue; fi
              if [[ "$tag" == "v1.0.23" || "$tag" == "v1.0.24" ]]; then
                echo "::warning::Skipping certificate comparison for $tag (pre-keystore release, one-time rotation approved 2026-11-27)."
                continue
              fi
              previous="$RUNNER_TEMP/previous-$tag.apk"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "Locket-${tag#v}.apk" --output "$previous" --clobber
              prior="$(certificate "$previous")"
              test -n "$prior"
              echo "$tag certificate SHA-256: $prior"
              if [[ "${actual,,}" != "${prior,,}" ]]; then
                echo "::error::Signing certificate differs from $tag; publication blocked."
                exit 1
              fi
              rm -f "$previous"
            done
          fi
          echo "LOCKET_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Prepare APK and update manifest
        run: |
          set -euo pipefail
          suffix=dev
          [[ "$LOCKET_CHANNEL" != release ]] || suffix=R
          version="1.0.${GITHUB_RUN_NUMBER}${suffix}"
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/Locket-$version.apk"
          xz -T0 -6 -c "output/Locket-$version.apk" > "output/Locket-$version.apk.xz"
          python3 scripts/prepare-pages-update.py

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: locket-signed-apk-${{ env.LOCKET_CHANNEL }}
          path: |
            output/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Check whether GitHub Pages is enabled
        id: pages_status
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')"
          case "$enabled" in
            true|false) echo "enabled=$enabled" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not determine Pages status"; exit 1 ;;
          esac
          if [[ "$enabled" == false ]]; then
            echo "::warning::GitHub Pages is disabled. Signed APK and XZ are available in Artifacts."
            echo 'GitHub Pages is disabled. Enable Settings > Pages > GitHub Actions to publish updates. Signed APK and XZ are available in Artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Stage both update channels
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/stage-pages-update.py
          # Keep the complete verified snapshot as a recovery artifact.
          du -sh pages

      - name: Save Pages snapshot
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: locket-pages-snapshot
          path: pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/locket-signing.keystore"

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
