name: Build Locket Android APK

on:
  # Ordinary source pushes never build. This marker is updated only on explicit request.
  push:
    branches: [main]
    paths: ['.github/manual-build-request.txt']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (R) — unchecked builds Dev'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: locket-pages-release
  # Cancel the preceding run only when explicitly requested.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[replace build]') }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[manual build request]'))
    name: Build signed APK
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}

    env:
      LOCKET_CHANNEL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release build]'))) && 'release' || 'dev' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.2.12479018'

      - name: Install Android SDK 37.1 and build tools
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --channel=3 --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Test and build Rust core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          cargo test --manifest-path rust-core/Cargo.toml --locked
          ./scripts/build-rust-android.sh

      - name: Build, sign, verify and package APK
        env:
          LOCKET_DEBUG_KEYSTORE_B64: ${{ secrets.LOCKET_DEBUG_KEYSTORE_B64 }}
          # Public certificate digest from successful build 43 (run 46097105930).
          # Keep this pin even after deleting historical GitHub Releases.
          EXPECTED_CERT_SHA256: c25ce38e6273954f28a705843e6630cb67b70e39ba48e406a1ba9eca299c55e6
        run: |
          set -euo pipefail
          if [[ -z "$LOCKET_DEBUG_KEYSTORE_B64" ]]; then
            echo "::error::Persistent Locket signing key is required."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/locket-signing.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$LOCKET_DEBUG_KEYSTORE_B64" | base64 --decode > "$key"
          unset LOCKET_DEBUG_KEYSTORE_B64
          expected="$(keytool -exportcert -keystore "$key" -alias androiddebugkey -storepass android | sha256sum | cut -d' ' -f1)"
          if [[ "${expected,,}" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Signing key does not match the established Locket certificate."
            exit 1
          fi

          echo "::group::Compile and sign (R8)"
          gradle assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file="$key" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          echo "::endgroup::"

          echo "::group::Verify APK"
          apk="app/build/outputs/apk/release/app-release.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s app/build/outputs/mapping/release/mapping.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          if [[ "${actual,,}" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signing certificate mismatch."
            exit 1
          fi
          unzip -l "$apk" | grep -F 'assets/dexopt/baseline.prof'
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          export LOCKET_CERT_SHA256="$actual"
          echo "LOCKET_CERT_SHA256=$actual" >> "$GITHUB_ENV"
          echo "::endgroup::"

          rm -f "$key"
          umask 022
          suffix=dev
          [[ "$LOCKET_CHANNEL" != release ]] || suffix=R
          version="1.0.${GITHUB_RUN_NUMBER}${suffix}"
          mkdir -p output
          cp "$apk" "output/Locket-$version.apk"
          xz -T0 -6 -c "output/Locket-$version.apk" > "output/Locket-$version.apk.xz"
          python3 scripts/prepare-pages-update.py

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: locket-signed-apk-${{ env.LOCKET_CHANNEL }}
          path: |
            output/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Prepare GitHub Pages update
        id: pages_status
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')"
          case "$enabled" in
            true|false) echo "enabled=$enabled" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not determine Pages status"; exit 1 ;;
          esac
          if [[ "$enabled" == true ]]; then
            python3 scripts/stage-pages-update.py
            du -sh pages
          else
            echo "::warning::GitHub Pages disabled; signed APK and XZ available in Artifacts."
            echo 'GitHub Pages disabled. Enable Settings > Pages > GitHub Actions to publish.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Save Pages snapshot
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: locket-pages-snapshot
          path: pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
