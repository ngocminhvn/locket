name: Build Locket Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locket-signed-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018'

      - name: Set up Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Test and build Rust core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cargo test --manifest-path rust-core/Cargo.toml --locked
          ./scripts/build-rust-android.sh
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "app/src/main/jniLibs/$abi/liblocket_core.so"
          done

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Restore persistent signing key
        env:
          LOCKET_DEBUG_KEYSTORE_B64: ${{ secrets.LOCKET_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$LOCKET_DEBUG_KEYSTORE_B64" ]]; then
            echo "::error::LOCKET_DEBUG_KEYSTORE_B64 is required; refusing to generate a different signing key."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/locket-signing.keystore"
          printf '%s' "$LOCKET_DEBUG_KEYSTORE_B64" | base64 --decode > "$key"
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          echo "LOCKET_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Build explicitly signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file="$LOCKET_KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify APK certificate and continuity with published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$apk"
          certificate() {
            "$signer" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1
          }
          actual="$(certificate "$apk")"
          expected="$(keytool -exportcert -keystore "$LOCKET_KEYSTORE" -alias androiddebugkey -storepass android | sha256sum | cut -d' ' -f1)"
          test -n "$actual"
          test -n "$expected"
          echo "APK signing certificate SHA-256: $actual"
          echo "Keystore certificate SHA-256: $expected"
          if [[ "${actual,,}" != "${expected,,}" ]]; then
            echo "::error::APK was not signed by the configured Locket keystore."
            exit 1
          fi
          # Compare against the latest existing version and the first known
          # signed update (23). Never publish a breaking signing-key migration.
          # Exception (one-time rotation approved by the owner 2026-11-27):
          # v1.0.23 and v1.0.24 were published before the persistent keystore
          # existed, so they were signed with ephemeral runner-generated
          # debug keys that are lost forever. Their certificates can never
          # match the configured keystore. From the next release on, the
          # keystore key is the single source of truth (checked above), so
          # the comparison below passes again for every newer release.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
            latest="$(printf '%s\n' "$releases" | grep -E '^v1\.0\.[0-9]+$' | sort -V | tail -n1 || true)"
            if [[ -n "$latest" && "$GITHUB_RUN_NUMBER" -lt "${latest##*.}" ]]; then
              echo "::error::Refusing to publish an older build as latest."
              exit 1
            fi
            for tag in "$latest" v1.0.23; do
              [[ -n "$tag" ]] || continue
              if ! printf '%s\n' "$releases" | grep -Fxq "$tag"; then continue; fi
              if [[ "$tag" == "v1.0.23" || "$tag" == "v1.0.24" ]]; then
                echo "::warning::Skipping certificate comparison for $tag (pre-keystore release, one-time rotation approved 2026-11-27)."
                continue
              fi
              previous="$RUNNER_TEMP/previous-$tag.apk"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "Locket-${tag#v}.apk" --output "$previous" --clobber
              prior="$(certificate "$previous")"
              test -n "$prior"
              echo "$tag certificate SHA-256: $prior"
              if [[ "${actual,,}" != "${prior,,}" ]]; then
                echo "::error::Signing certificate differs from $tag; publication blocked."
                exit 1
              fi
              rm -f "$previous"
            done
          fi
          echo "LOCKET_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Prepare APK and update manifest
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Locket-1.0.$GITHUB_RUN_NUMBER.apk"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          version = f"1.0.{build}"
          apk = Path(f"Locket-{version}.apk")
          data = {
              "versionCode": build,
              "versionName": version,
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}/{apk.name}",
              "sha256": hashlib.file_digest(apk.open("rb"), "sha256").hexdigest(),
              "sizeBytes": apk.stat().st_size,
              "certificateSha256": os.environ["LOCKET_CERT_SHA256"],
              "commit": os.environ["GITHUB_SHA"]
          }
          Path("update.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: locket-signed-apk
          path: |
            Locket-*.apk
            update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed update APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.$GITHUB_RUN_NUMBER"
          apk="Locket-1.0.$GITHUB_RUN_NUMBER.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" update.json --clobber
          else
            gh release create "$tag" "$apk" update.json --target "$GITHUB_SHA" --title "Locket 1.0.$GITHUB_RUN_NUMBER" --generate-notes --latest
          fi

      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/locket-signing.keystore"
